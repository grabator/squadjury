<!doctype html>
<!-- Crta pozadinu stadiona: node scripts/stadion.mjs pravi public/img/stadion.webp -->
<html><body style="margin:0;background:#0a0d16">
<canvas id="bg" width="2000" height="1250" style="display:block;filter:blur(6px) saturate(1.1);margin:-20px"></canvas>
<script>
// ---------- noćni stadion (pozadina) ----------
(() => {
  const c = document.getElementById('bg'), x = c.getContext('2d'), W = c.width, H = c.height;
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const sky = x.createLinearGradient(0, 0, 0, H * .5); sky.addColorStop(0, '#070b18'); sky.addColorStop(1, '#1b2340'); x.fillStyle = sky; x.fillRect(0, 0, W, H);
  // krov i tribine
  x.fillStyle = '#0d111d'; x.beginPath(); x.moveTo(0, H * .2); x.quadraticCurveTo(W / 2, H * .1, W, H * .2); x.lineTo(W, H * .58); x.lineTo(0, H * .58); x.fill();
  for (let y = H * .24; y < H * .57; y += 5) for (let i = 0; i < W; i += 5) { if (rnd() < .55) { const l = 18 + rnd() * 40; x.fillStyle = `hsl(${rnd() * 360},${10 + rnd() * 30}%,${l * (0.6 + (y / H))}%)`; x.fillRect(i, y, 3, 3); } }
  x.fillStyle = 'rgba(10,14,26,.45)'; x.fillRect(0, H * .24, W, H * .34);
  // reklamni pano
  const ad = x.createLinearGradient(0, 0, W, 0); ad.addColorStop(0, '#1e3a8a'); ad.addColorStop(.5, '#2563eb'); ad.addColorStop(1, '#1e3a8a'); x.fillStyle = ad; x.fillRect(0, H * .565, W, H * .025);
  // teren u perspektivi
  for (let i = 0; i < 14; i++) { const y0 = H * .59 + i * i * 2.6, y1 = H * .59 + (i + 1) * (i + 1) * 2.6; x.fillStyle = i % 2 ? '#2d6b37' : '#327a3e'; x.fillRect(0, y0, W, y1 - y0); }
  x.strokeStyle = 'rgba(255,255,255,.55)'; x.lineWidth = 3; x.beginPath(); x.moveTo(W * .12, H); x.lineTo(W * .3, H * .6); x.lineTo(W * .7, H * .6); x.lineTo(W * .88, H); x.stroke();
  x.beginPath(); x.moveTo(W / 2, H * .6); x.lineTo(W / 2, H); x.stroke(); x.beginPath(); x.ellipse(W / 2, H * .78, 170, 48, 0, 0, Math.PI * 2); x.stroke();
  // reflektori
  const lamp = (cx, cy) => { const r = x.createRadialGradient(cx, cy, 0, cx, cy, 520); r.addColorStop(0, 'rgba(255,248,225,.95)'); r.addColorStop(.05, 'rgba(255,244,210,.55)'); r.addColorStop(.35, 'rgba(255,236,190,.12)'); r.addColorStop(1, 'rgba(255,236,190,0)'); x.fillStyle = r; x.fillRect(0, 0, W, H);
    for (let a = 0; a < 4; a++) for (let b = 0; b < 6; b++) { x.fillStyle = '#fffbea'; x.fillRect(cx - 45 + b * 16, cy - 20 + a * 11, 11, 7); } };
  lamp(W * .1, H * .13); lamp(W * .9, H * .13); lamp(W * .38, H * .1); lamp(W * .64, H * .1);
  const pl = x.createRadialGradient(W / 2, H * .8, 0, W / 2, H * .8, W * .6); pl.addColorStop(0, 'rgba(255,255,230,.18)'); pl.addColorStop(1, 'rgba(0,0,0,.35)'); x.fillStyle = pl; x.fillRect(0, H * .58, W, H * .42);
  // šum
  const im = x.getImageData(0, 0, W, H); for (let i = 0; i < im.data.length; i += 4) { const n = (rnd() - .5) * 14; im.data[i] += n; im.data[i + 1] += n; im.data[i + 2] += n; } x.putImageData(im, 0, 0);
})();
document.documentElement.dataset.ok = 1;
</script></body></html>
